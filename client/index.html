<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta
      name="description"
      content="BreatheWise AI turns live city air quality and your home setup into realistic, personalized clean-air guidance — powered by planning & reasoning AI."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentora-ai-v2.web.app/" />
    <meta property="og:title" content="BreatheWise AI — Know Your Air. Protect Your Family." />
    <meta
      property="og:description"
      content="Instant plain-language clean-air decisions grounded in live city AQI, your home setup, and CPCB/WHO guidelines."
    />
    <meta property="og:image" content="https://agentora-ai-v2.web.app/og-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BreatheWise AI — Personal Clean-Air Copilot" />
    <meta
      name="twitter:description"
      content="Live CPCB air quality translated into realistic everyday decisions for Indian families and commuters."
    />
    <meta name="twitter:image" content="https://agentora-ai-v2.web.app/og-card.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('breathewise:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0B0E12' : '#F7F8FA');
        } catch (e) {}
      })();
    </script>
    <title>BreatheWise AI — Personal Clean-Air Copilot</title>
  </head>
  <body class="bg-[#F7F8FA] text-slate-900 antialiased transition-colors duration-200 dark:bg-[#0B0E12] dark:text-[#EEF2F6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
