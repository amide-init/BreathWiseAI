<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="BreatheWise AI turns live city air quality into plain-English answers for your family & daily commute — walks, kids' play, windows, masks, indoor air & CO₂ impact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentora-ai-v2.web.app/" />
    <meta property="og:title" content="BreatheWise AI — Know Your Air. Protect Your Family." />
    <meta
      property="og:description"
      content="Instant plain-English answers for today's air quality: Can I walk outside? Can kids play? Keep windows shut? Grounded in India CPCB & WHO guidelines."
    />
    <meta property="og:image" content="https://agentora-ai-v2.web.app/og-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BreatheWise AI — Personal Clean-Air Assistant" />
    <meta
      name="twitter:description"
      content="Live CPCB air quality translated into everyday decisions for Indian families and commuters."
    />
    <meta name="twitter:image" content="https://agentora-ai-v2.web.app/og-card.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Shantell+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('breathewise:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#09090b' : '#fafafa');
        } catch (e) {}
      })();
    </script>
    <title>BreatheWise AI — Personal Clean-Air Assistant</title>
  </head>
  <body class="bg-zinc-50 text-zinc-950 antialiased transition-colors duration-200 dark:bg-zinc-950 dark:text-zinc-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
